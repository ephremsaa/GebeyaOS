services:
  - type: web
    name: gebeyaos-portal
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run migrate:cloud && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Addis_Ababa
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: gebeyaos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GEBEYAOS_LICENSE_SECRET
        generateValue: true

databases:
  - name: gebeyaos-db
    plan: free
    databaseName: gebeyaos_branch
    user: gebeyaos_app
