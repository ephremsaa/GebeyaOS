name: GebeyaOS Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - deploy-ready

jobs:
  verify:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Monorepo Typecheck
        run: npx tsc --noEmit --composite false

      - name: Run Test Suite
        run: npm test

  build-release-bundle:
    name: Build Branch Release Bundle & Containers
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build --workspaces

      - name: Build POS Frontend
        run: |
          cd apps/pos-web
          npm run build

      - name: Generate Checksums & Create Tarball Release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist-release/gebeyaos-$TAG_NAME
          cp -r apps packages database scripts docs dist-release/gebeyaos-$TAG_NAME/
          tar -czf dist-release/gebeyaos-branch-$TAG_NAME.tar.gz -C dist-release gebeyaos-$TAG_NAME
          cd dist-release && sha256sum gebeyaos-branch-$TAG_NAME.tar.gz > gebeyaos-branch-$TAG_NAME.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
