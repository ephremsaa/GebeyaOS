services:
  branch-db:
    image: postgres:16-alpine
    container_name: gebeyaos-branch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gebeyaos_branch}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - branch-db-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/001_initial_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    command: >
      postgres -c wal_level=replica
               -c max_wal_size=2GB
               -c min_wal_size=512MB
               -c checkpoint_completion_target=0.9
               -c fsync=on
               -c synchronous_commit=on
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gebeyaos_branch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  branch-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gebeyaos-branch-server
    restart: unless-stopped
    depends_on:
      branch-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: branch-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-gebeyaos_branch}
      BRANCH_CODE: ${BRANCH_CODE:-BOLE-01}
      IS_HQ: "false"
      HQ_SYNC_URL: ${HQ_SYNC_URL:-https://hq.gebeyaos.et/api/sync}
    ports:
      - "3000:3000"

  branch-backup:
    image: postgres:16-alpine
    container_name: gebeyaos-branch-backup
    restart: unless-stopped
    depends_on:
      branch-db:
        condition: service_healthy
    environment:
      PGHOST: branch-db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-gebeyaos_branch}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: >
      sh -c "chmod +x /usr/local/bin/backup.sh &&
             echo '0 1 * * * /usr/local/bin/backup.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root &&
             crond -f -l 2"

volumes:
  branch-db-data:
    driver: local
