# ============================================================
# GebeyaOS – HQ Server Docker Compose (Production)
# Part 0 safety fixes applied:
#   • PostgreSQL port 5433 NOT exposed to public internet
#   • Caddy for automatic HTTPS + reverse proxy
#   • seed-dev is NOT wired here
#   • All secrets required via environment (no defaults for passwords)
# ============================================================

services:
  hq-db:
    image: postgres:16-alpine
    container_name: gebeyaos-hq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HQ_DB_NAME:-gebeyaos_central}
      POSTGRES_USER: ${HQ_DB_USER:-gebeyaos_hq}
      POSTGRES_PASSWORD: ${HQ_DB_PASSWORD:?HQ_DB_PASSWORD is required}
    volumes:
      - hq-db-data:/var/lib/postgresql/data
    # NO ports mapping – db is reachable only inside the hq-internal network
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1GB
               -c work_mem=8MB
               -c maintenance_work_mem=128MB
               -c fsync=on
               -c synchronous_commit=on
               -c wal_level=replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HQ_DB_USER:-gebeyaos_hq} -d ${HQ_DB_NAME:-gebeyaos_central}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hq-internal

  hq-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hq-server
    container_name: gebeyaos-hq-server
    restart: unless-stopped
    depends_on:
      hq-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: hq-db
      DB_PORT: 5432
      DB_USER: ${HQ_DB_USER:-gebeyaos_hq}
      DB_PASSWORD: ${HQ_DB_PASSWORD:?HQ_DB_PASSWORD is required}
      DB_NAME: ${HQ_DB_NAME:-gebeyaos_central}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.gebeyaos.et}
      IS_HQ: "true"
      TZ: Africa/Addis_Ababa
      APP_VERSION: ${APP_VERSION:-1.0.0}
    # hq-server not exposed directly – Caddy handles all external traffic
    networks:
      - hq-internal
      - hq-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ready | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: gebeyaos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - hq-external
    depends_on:
      hq-server:
        condition: service_healthy

volumes:
  hq-db-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  hq-internal:
    driver: bridge
    internal: true      # hq-db completely isolated from outside
  hq-external:
    driver: bridge
