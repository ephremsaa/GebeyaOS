services:
  hq-db:
    image: postgres:16-alpine
    container_name: gebeyaos-hq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HQ_DB_NAME:-gebeyaos_central}
      POSTGRES_USER: ${HQ_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HQ_DB_PASSWORD:-postgres}
    volumes:
      - hq-db-data:/var/lib/postgresql/data
      - ../database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seeds/001_initial_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    command: >
      postgres -c max_connections=200
               -c shared_buffers=2GB
               -c effective_cache_size=6GB
               -c work_mem=16MB
               -c maintenance_work_mem=512MB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HQ_DB_USER:-postgres} -d ${HQ_DB_NAME:-gebeyaos_central}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hq-server:
    build:
      context: ../
      dockerfile: docker/Dockerfile.hq-server
    container_name: gebeyaos-hq-server
    restart: unless-stopped
    depends_on:
      hq-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: hq-db
      DB_PORT: 5432
      DB_USER: ${HQ_DB_USER:-postgres}
      DB_PASSWORD: ${HQ_DB_PASSWORD:-postgres}
      DB_NAME: ${HQ_DB_NAME:-gebeyaos_central}
      IS_HQ: "true"
    ports:
      - "4000:4000"

volumes:
  hq-db-data:
    driver: local
